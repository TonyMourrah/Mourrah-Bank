# Connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/banquedb
spring.datasource.username=${DB_USERNAME:tony}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:cette-cle-est-juste-pour-le-dev-local-remplace-moi-1234567890}